# ◎ Origem – Fenstermanager-Einstellungen

monitor = , preferred, auto, 1

exec-once = origem-shell
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

env = XCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark

$term = kitty

input {
    kb_layout = de
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(f2a65aff) rgba(5ad1c0ff) 45deg
    col.inactive_border = rgba(1e2530ff)
    layout = dwindle
}

decoration {
    rounding = 14
    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

animations {
    enabled = true
    bezier = smooth, 0.22, 1, 0.36, 1
    animation = windows, 1, 5, smooth, popin 85%
    animation = workspaces, 1, 5, smooth, slide
    animation = fade, 1, 4, smooth
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0b0e13)
}

# Anpassungen für virtuelle Maschinen (wird beim Login automatisch erzeugt)
source = ~/.config/hypr/vm.conf

# --- Tastenkürzel ---
bind = SUPER, SPACE, exec, origem-shell --toggle launcher
bind = SUPER, A, exec, origem-shell --toggle ai
bind = SUPER, RETURN, exec, $term
bind = SUPER, B, exec, firefox
bind = SUPER, E, exec, thunar
bind = SUPER, G, exec, steam
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER SHIFT, E, exit

bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
