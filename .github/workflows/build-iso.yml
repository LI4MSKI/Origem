name: Origem ISO bauen

on:
  workflow_dispatch:      # Knopf "Run workflow" im Actions-Tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Speicherplatz freiräumen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Projekt holen
        uses: actions/checkout@v5

      - name: ISO im Arch-Linux-Container bauen
        run: |
          set -o pipefail
          docker run --rm --privileged -v "$PWD":/origem archlinux:latest bash -c '
            set -e
            sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
            sed -i "s/^CheckSpace/#CheckSpace/" /etc/pacman.conf
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm archiso
            WORK=/origem/work OUT=/origem/out bash /origem/build.sh
          ' 2>&1 | tee build.log
          ls -lh out/

      - name: Fehlerprotokoll anzeigen
        if: failure()
        run: |
          msg=$(tail -n 120 build.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build-Log (letzte 120 Zeilen)::$msg"

      - name: ISO zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: origem-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 14
