name: Origem ISO bauen

on:
  workflow_dispatch:      # Knopf "Run workflow" im Actions-Tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Speicherplatz freiräumen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Projekt holen
        uses: actions/checkout@v4

      - name: ISO im Arch-Linux-Container bauen
        run: |
          docker run --rm --privileged -v "$PWD":/origem archlinux:latest bash -c '
            pacman -Syu --noconfirm archiso &&
            WORK=/origem/work OUT=/origem/out bash /origem/build.sh
          '
          ls -lh out/

      - name: ISO zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: origem-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 14
